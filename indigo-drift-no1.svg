<?xml version="1.0" encoding="UTF-8"?>
<!--
  Indigo Drift No. 1
  An abstract landscape, more experimental than its sedimentary sibling:
  a night field at a slight tilt, moire interference, a dashed rain,
  an eclipsed ring, contour islands that never touch the edges,
  and glitch slices tearing through the weather.
  Pure shapes, gradients and filters — no outside fonts or images.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img"
     aria-label="Abstract night landscape in indigo, teal, acid green and magenta with an eclipse ring">
  <title>Indigo Drift No. 1</title>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#12102a"/>
      <stop offset="55%"  stop-color="#1b1c46"/>
      <stop offset="100%" stop-color="#1e2a52"/>
    </linearGradient>

    <linearGradient id="fieldGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#23c3b0" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#3d4fd8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3d4fd8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowMag" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ff5d8f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff5d8f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowAcid" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#c6f24e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c6f24e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0%"   stop-color="#0b0a18" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#0b0a18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0a18" stop-opacity="0.55"/>
    </radialGradient>

    <!-- heavy displacement: landmass edges -->
    <filter id="drift" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.005 0.011" numOctaves="3" seed="21" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="driftSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.014" numOctaves="2" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="driftFine" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.03" numOctaves="2" seed="14" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="blur12" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.88
                0 0 0 0 0.90
                0 0 0 0 0.97
                0 0 0 0.5 0"/>
    </filter>
  </defs>

  <!-- night ground -->
  <rect x="0" y="0" width="1000" height="800" fill="url(#night)"/>

  <!-- weather glows -->
  <ellipse cx="180" cy="640" rx="340" ry="240" fill="url(#glowMag)" style="mix-blend-mode:screen"/>
  <ellipse cx="860" cy="120" rx="300" ry="200" fill="url(#glowAcid)" style="mix-blend-mode:screen"/>

  <!-- the tilted field: a landscape seen at an angle -->
  <g transform="rotate(-5 500 400)">
    <rect x="-120" y="470" width="1240" height="330" fill="url(#fieldGrad)" filter="url(#drift)" opacity="0.9"/>
    <rect x="-120" y="520" width="1240" height="280" fill="#2a3a9e" opacity="0.18" filter="url(#drift)"/>
  </g>

  <!-- moire interference across the sky -->
  <g stroke="#eef2f7" stroke-width="1" opacity="0.10">
    <line x1="-100" y1="120" x2="1100" y2="120"/>
    <line x1="-100" y1="140" x2="1100" y2="140"/>
    <line x1="-100" y1="160" x2="1100" y2="160"/>
    <line x1="-100" y1="180" x2="1100" y2="180"/>
    <line x1="-100" y1="200" x2="1100" y2="200"/>
    <line x1="-100" y1="220" x2="1100" y2="220"/>
    <line x1="-100" y1="240" x2="1100" y2="240"/>
    <line x1="-100" y1="260" x2="1100" y2="260"/>
    <line x1="-100" y1="280" x2="1100" y2="280"/>
    <line x1="-100" y1="300" x2="1100" y2="300"/>
  </g>
  <g stroke="#23c3b0" stroke-width="1" opacity="0.10" transform="rotate(2.6 500 400)">
    <line x1="-100" y1="130" x2="1100" y2="130"/>
    <line x1="-100" y1="150" x2="1100" y2="150"/>
    <line x1="-100" y1="170" x2="1100" y2="170"/>
    <line x1="-100" y1="190" x2="1100" y2="190"/>
    <line x1="-100" y1="210" x2="1100" y2="210"/>
    <line x1="-100" y1="230" x2="1100" y2="230"/>
    <line x1="-100" y1="250" x2="1100" y2="250"/>
    <line x1="-100" y1="270" x2="1100" y2="270"/>
    <line x1="-100" y1="290" x2="1100" y2="290"/>
    <line x1="-100" y1="310" x2="1100" y2="310"/>
  </g>

  <!-- dashed rain: columns of falling light -->
  <g stroke-linecap="round" filter="url(#driftFine)">
    <line x1="120" y1="40"  x2="120" y2="330" stroke="#eef2f7" stroke-width="2" opacity="0.5"  stroke-dasharray="5 28"/>
    <line x1="210" y1="20"  x2="210" y2="380" stroke="#23c3b0" stroke-width="2" opacity="0.4"  stroke-dasharray="4 22"/>
    <line x1="352" y1="60"  x2="352" y2="300" stroke="#ff5d8f" stroke-width="2" opacity="0.45" stroke-dasharray="6 30"/>
    <line x1="430" y1="10"  x2="430" y2="360" stroke="#eef2f7" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 26"/>
    <line x1="545" y1="50"  x2="545" y2="340" stroke="#c6f24e" stroke-width="2" opacity="0.4"  stroke-dasharray="5 24"/>
    <line x1="655" y1="30"  x2="655" y2="400" stroke="#eef2f7" stroke-width="2" opacity="0.35" stroke-dasharray="4 30"/>
    <line x1="775" y1="70"  x2="775" y2="320" stroke="#ff5d8f" stroke-width="1.5" opacity="0.35" stroke-dasharray="6 26"/>
    <line x1="905" y1="40"  x2="905" y2="380" stroke="#23c3b0" stroke-width="2" opacity="0.4"  stroke-dasharray="5 28"/>
  </g>

  <!-- the eclipse -->
  <circle cx="700" cy="190" r="112" fill="none" stroke="#eef2f7" stroke-width="16" opacity="0.16" filter="url(#blur12)"/>
  <circle cx="700" cy="190" r="110" fill="none" stroke="#eef2f7" stroke-width="3"   opacity="0.9"  filter="url(#driftFine)"/>
  <circle cx="700" cy="190" r="158" fill="none" stroke="#c6f24e" stroke-width="1.5" opacity="0.35" stroke-dasharray="1 15"/>
  <circle cx="700" cy="190" r="72"  fill="#0b0a18" opacity="0.55" filter="url(#driftSoft)"/>

  <!-- survey marks: a quiet X across the field -->
  <g stroke="#ff5d8f" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
    <line x1="80"  y1="560" x2="330" y2="700"/>
    <line x1="330" y1="560" x2="80"  y2="700"/>
    <line x1="830" y1="470" x2="960" y2="560"/>
    <line x1="960" y1="470" x2="830" y2="560"/>
  </g>

  <!-- floating fragments (the birds) -->
  <g>
    <polygon points="500,250 530,290 470,292" fill="#ff5d8f" opacity="0.45" transform="rotate(14 500 271)"/>
    <polygon points="580,300 606,332 556,336" fill="#c6f24e" opacity="0.35" transform="rotate(-8 580 318)"/>
    <rect x="404" y="222" width="26" height="10" fill="#23c3b0" opacity="0.5" transform="rotate(-18 417 227)"/>
    <rect x="872" y="300" width="34" height="8"  fill="#eef2f7" opacity="0.3" transform="rotate(9 889 304)"/>
    <circle cx="630" cy="352" r="5" fill="#eef2f7" opacity="0.5"/>
    <circle cx="152" cy="205" r="4" fill="#ff5d8f" opacity="0.5"/>
  </g>

  <!-- broken horizon: landmasses that never touch the edges -->
  <g filter="url(#drift)">
    <path d="M 60 452 L 300 448 L 342 470 L 240 492 L 90 486 Z"   fill="#2a3a9e" opacity="0.85"/>
    <path d="M 430 470 L 690 464 L 738 486 L 600 508 L 462 500 Z" fill="#23c3b0" opacity="0.4"/>
    <path d="M 770 452 L 950 448 L 975 468 L 862 488 L 788 478 Z" fill="#2a3a9e" opacity="0.7"/>
    <path d="M 150 540 L 420 534 L 470 556 L 330 580 L 180 572 Z" fill="#1e2a52" opacity="0.9"/>
    <path d="M 540 556 L 820 550 L 868 572 L 720 596 L 570 588 Z" fill="#2a3a9e" opacity="0.5"/>
  </g>

  <!-- contour islands: topographic thoughts -->
  <g fill="none" stroke-linecap="round" filter="url(#driftSoft)">
    <path d="M -60 660 C 140 580, 330 720, 520 630 C 700 550, 880 660, 1060 600"
          stroke="#c6f24e" stroke-width="2.5" opacity="0.75"/>
    <path d="M -60 690 C 150 610, 340 750, 530 660 C 710 580, 890 690, 1060 630"
          stroke="#23c3b0" stroke-width="2"   opacity="0.55"/>
    <path d="M -60 720 C 160 640, 350 780, 540 690 C 720 610, 900 720, 1060 660"
          stroke="#3d4fd8" stroke-width="2"   opacity="0.6"/>
    <path d="M -60 750 C 170 670, 360 810, 550 720 C 730 640, 910 750, 1060 690"
          stroke="#eef2f7" stroke-width="1.5" opacity="0.35"/>
    <path d="M -60 780 C 180 700, 370 840, 560 750 C 740 670, 920 780, 1060 720"
          stroke="#ff5d8f" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- glitch slices -->
  <g style="mix-blend-mode:screen" filter="url(#driftFine)">
    <rect x="90"  y="512" width="520" height="10" fill="#23c3b0" opacity="0.65"/>
    <rect x="420" y="568" width="440" height="7"  fill="#ff5d8f" opacity="0.6"/>
    <rect x="610" y="404" width="310" height="8"  fill="#eef2f7" opacity="0.4"/>
    <rect x="120" y="356" width="260" height="6"  fill="#c6f24e" opacity="0.45"/>
  </g>

  <!-- vignette + grain -->
  <rect x="0" y="0" width="1000" height="800" fill="url(#vig)"/>
  <rect x="0" y="0" width="1000" height="800" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:overlay"/>

  <!-- signature -->
  <text x="952" y="776" text-anchor="end" font-family="Georgia, 'Times New Roman', serif"
        font-size="15" fill="#eef2f7" opacity="0.55">Indigo Drift No. 1 — 2026</text>
</svg>
