<?xml version="1.0" encoding="UTF-8"?>
<!--
  Carmine Bloom No. 3 — Detonation
  The full-bleed bloom of No. 2, the instant it ruptures. The dark heart
  blows white-hot; petals break into shards that fly radially with trails;
  splatter, gold shrapnel and shockwave rings carry the force outward.
  A faint afterimage of the intact bloom still hangs behind the blast.
  Pure shapes, gradients and filters - no outside fonts or images.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img"
     aria-label="Exploding red bloom: white-hot rupture, radial shards with trails, splatter and shockwave rings">
  <title>Carmine Bloom No. 3 — Detonation</title>

  <defs>
    <!-- warm amber ground -->
    <linearGradient id="air" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#f4ddc7"/>
      <stop offset="60%"  stop-color="#eed0b4"/>
      <stop offset="100%" stop-color="#e6bf9f"/>
    </linearGradient>

    <!-- blast light -->
    <radialGradient id="burst" cx="0.486" cy="0.495" r="0.62">
      <stop offset="0%"   stop-color="#fff3e0" stop-opacity="0.9"/>
      <stop offset="22%"  stop-color="#f2937e" stop-opacity="0.6"/>
      <stop offset="55%"  stop-color="#e8604c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8604c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vig" cx="0.5" cy="0.47" r="0.9">
      <stop offset="0%"   stop-color="#3a0f14" stop-opacity="0"/>
      <stop offset="76%"  stop-color="#3a0f14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a0f14" stop-opacity="0.38"/>
    </radialGradient>

    <!-- reusable shards -->
    <path id="shardA" d="M 0 0 Q 20 -11 42 -3 Q 23 9 0 0 Z"/>
    <path id="shardB" d="M 0 0 Q 14 -8 27 -3 Q 15 6 0 0 Z"/>
    <path id="shardC" d="M 0 0 Q 13 2 28 9 Q 13 11 0 5 Z"/>
    <path id="drop"   d="M 0 0 Q 7 -3 15 -1 Q 7 3 0 0 Z"/>

    <filter id="flesh" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="turbulence" baseFrequency="0.006 0.009" numOctaves="3" seed="23" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="48" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fleshMid" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="turbulence" baseFrequency="0.011 0.016" numOctaves="3" seed="31" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fleshFine" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="turbulence" baseFrequency="0.022 0.030" numOctaves="2" seed="47" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="soft6"  x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft16" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="16"/></filter>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="33" stitchTiles="stitch"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.32
                0 0 0 0 0.14
                0 0 0 0 0.12
                0 0 0 0.38 0"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1000" height="800" fill="url(#air)"/>

  <!-- afterimage: the bloom it was, one instant ago -->
  <g opacity="0.14" filter="url(#flesh)">
    <ellipse cx="500" cy="400" rx="640" ry="240" fill="#f09b88" transform="rotate(12 500 400)"/>
    <ellipse cx="500" cy="400" rx="480" ry="185" fill="#e8604c" transform="rotate(71 500 400)"/>
    <ellipse cx="500" cy="400" rx="325" ry="138" fill="#c0392b" transform="rotate(142 500 400)"/>
    <circle cx="486" cy="396" r="120" fill="#7a1622"/>
  </g>

  <!-- blast light over everything -->
  <rect x="0" y="0" width="1000" height="800" fill="url(#burst)"/>

  <!-- broken great lobes still leaving the frame -->
  <g filter="url(#flesh)">
    <path d="M 620 -60 Q 900 40 1060 260 L 1060 -60 Z" fill="#f09b88" opacity="0.85"/>
    <path d="M -80 620 Q 120 760 380 840 L -80 840 Z"  fill="#ee917e" opacity="0.8"/>
    <path d="M 880 560 Q 1000 620 1080 780 L 1080 540 Z" fill="#e8604c" opacity="0.7"/>
    <path d="M -60 120 Q 40 60 180 20 L -60 -40 Z" fill="#f4a08c" opacity="0.7"/>
  </g>

  <!-- shockwave rings -->
  <g fill="none" stroke="#7a1622" filter="url(#fleshFine)">
    <circle cx="486" cy="396" r="150" stroke-width="3"   stroke-dasharray="3 11" opacity="0.5"/>
    <circle cx="486" cy="396" r="245" stroke-width="2.4" stroke-dasharray="2 15" opacity="0.34"/>
    <circle cx="486" cy="396" r="370" stroke-width="2"   stroke-dasharray="2 19" opacity="0.22"/>
    <circle cx="486" cy="396" r="520" stroke-width="1.6" stroke-dasharray="1 24" opacity="0.14"/>
  </g>

  <!-- radial speed lines: the force field -->
  <g stroke-linecap="round" filter="url(#fleshFine)">
    <line x1="586" y1="422" x2="860" y2="452" stroke="#e05a44" stroke-width="5"   opacity="0.5"/>
    <line x1="560" y1="470" x2="820" y2="600" stroke="#e8604c" stroke-width="4"   opacity="0.42"/>
    <line x1="520" y1="500" x2="640" y2="740" stroke="#c0392b" stroke-width="6"   opacity="0.5"/>
    <line x1="470" y1="510" x2="430" y2="760" stroke="#e05a44" stroke-width="4"   opacity="0.4"/>
    <line x1="430" y1="490" x2="230" y2="700" stroke="#e8604c" stroke-width="5"   opacity="0.46"/>
    <line x1="390" y1="460" x2="140" y2="580" stroke="#c0392b" stroke-width="4"   opacity="0.4"/>
    <line x1="360" y1="420" x2="80"  y2="430" stroke="#e05a44" stroke-width="6"   opacity="0.5"/>
    <line x1="360" y1="380" x2="110" y2="300" stroke="#e8604c" stroke-width="4"   opacity="0.4"/>
    <line x1="390" y1="340" x2="180" y2="140" stroke="#c0392b" stroke-width="5"   opacity="0.46"/>
    <line x1="430" y1="310" x2="290" y2="60"  stroke="#e05a44" stroke-width="4"   opacity="0.4"/>
    <line x1="470" y1="290" x2="450" y2="20"  stroke="#e8604c" stroke-width="6"   opacity="0.5"/>
    <line x1="520" y1="300" x2="640" y2="50"  stroke="#c0392b" stroke-width="4"   opacity="0.4"/>
    <line x1="560" y1="330" x2="800" y2="120" stroke="#e05a44" stroke-width="5"   opacity="0.46"/>
    <line x1="600" y1="360" x2="880" y2="260" stroke="#e8604c" stroke-width="4"   opacity="0.4"/>
    <line x1="620" y1="390" x2="940" y2="370" stroke="#c0392b" stroke-width="5"   opacity="0.44"/>
    <line x1="500" y1="396" x2="760" y2="180" stroke="#a31f2b" stroke-width="2"   opacity="0.3" stroke-dasharray="14 10"/>
    <line x1="500" y1="396" x2="240" y2="200" stroke="#a31f2b" stroke-width="2"   opacity="0.3" stroke-dasharray="12 12"/>
    <line x1="500" y1="396" x2="720" y2="640" stroke="#a31f2b" stroke-width="2"   opacity="0.3" stroke-dasharray="16 10"/>
    <line x1="500" y1="396" x2="200" y2="620" stroke="#a31f2b" stroke-width="2"   opacity="0.3" stroke-dasharray="12 14"/>
  </g>

  <!-- flying petal shards with motion trails -->
  <g filter="url(#fleshFine)">
    <line x1="500" y1="396" x2="760" y2="462" stroke="#f09b88" stroke-width="10" opacity="0.22"/>
    <use href="#shardA" fill="#e8604c" opacity="0.9"  transform="translate(766 468) rotate(18) scale(1.7)"/>
    <line x1="500" y1="396" x2="662" y2="548" stroke="#c0392b" stroke-width="8"  opacity="0.2"/>
    <use href="#shardA" fill="#c0392b" opacity="0.9"  transform="translate(668 554) rotate(46) scale(1.25)"/>
    <line x1="500" y1="396" x2="640" y2="736" stroke="#e05a44" stroke-width="12" opacity="0.22"/>
    <use href="#shardA" fill="#e05a44" opacity="0.92" transform="translate(648 744) rotate(70) scale(1.9)"/>
    <line x1="500" y1="396" x2="466" y2="652" stroke="#f4a08c" stroke-width="9"  opacity="0.2"/>
    <use href="#shardB" fill="#f4a08c" opacity="0.9"  transform="translate(460 662) rotate(96) scale(1.3)"/>
    <line x1="500" y1="396" x2="286" y2="742" stroke="#e8604c" stroke-width="12" opacity="0.22"/>
    <use href="#shardA" fill="#e8604c" opacity="0.92" transform="translate(278 752) rotate(124) scale(2.0)"/>
    <line x1="500" y1="396" x2="240" y2="540" stroke="#e05a44" stroke-width="9"  opacity="0.2"/>
    <use href="#shardB" fill="#e05a44" opacity="0.9"  transform="translate(232 548) rotate(152) scale(1.4)"/>
    <line x1="500" y1="396" x2="152" y2="420" stroke="#c0392b" stroke-width="11" opacity="0.22"/>
    <use href="#shardA" fill="#c0392b" opacity="0.9"  transform="translate(142 424) rotate(176) scale(1.7)"/>
    <line x1="500" y1="396" x2="254" y2="310" stroke="#a31f2b" stroke-width="8"  opacity="0.2"/>
    <use href="#shardC" fill="#a31f2b" opacity="0.9"  transform="translate(246 304) rotate(202) scale(1.2)"/>
    <line x1="500" y1="396" x2="216" y2="120" stroke="#e05a44" stroke-width="12" opacity="0.22"/>
    <use href="#shardA" fill="#e05a44" opacity="0.92" transform="translate(208 112) rotate(227) scale(1.9)"/>
    <line x1="500" y1="396" x2="392" y2="138" stroke="#e8604c" stroke-width="9"  opacity="0.2"/>
    <use href="#shardB" fill="#e8604c" opacity="0.9"  transform="translate(386 130) rotate(252) scale(1.3)"/>
    <line x1="500" y1="396" x2="508" y2="52"  stroke="#f4a08c" stroke-width="11" opacity="0.22"/>
    <use href="#shardA" fill="#f4a08c" opacity="0.9"  transform="translate(512 40) rotate(277) scale(1.8)"/>
    <line x1="500" y1="396" x2="630" y2="140" stroke="#c0392b" stroke-width="9"  opacity="0.2"/>
    <use href="#shardB" fill="#c0392b" opacity="0.9"  transform="translate(636 134) rotate(302) scale(1.4)"/>
    <line x1="500" y1="396" x2="828" y2="152" stroke="#e05a44" stroke-width="13" opacity="0.22"/>
    <use href="#shardA" fill="#e05a44" opacity="0.92" transform="translate(836 146) rotate(327) scale(2.0)"/>
    <line x1="500" y1="396" x2="726" y2="330" stroke="#a31f2b" stroke-width="7"  opacity="0.2"/>
    <use href="#shardC" fill="#a31f2b" opacity="0.9"  transform="translate(732 326) rotate(347) scale(1.1)"/>
  </g>

  <!-- splatter: droplets thinning with distance -->
  <g filter="url(#fleshFine)">
    <use href="#drop" fill="#7a1622" transform="translate(610 470) rotate(35) scale(1.4)"/>
    <use href="#drop" fill="#7a1622" transform="translate(560 560) rotate(120) scale(1.2)"/>
    <use href="#drop" fill="#7a1622" transform="translate(360 540) rotate(200) scale(1.3)"/>
    <use href="#drop" fill="#7a1622" transform="translate(300 380) rotate(255) scale(1.2)"/>
    <use href="#drop" fill="#7a1622" transform="translate(430 250) rotate(300) scale(1.3)"/>
    <use href="#drop" fill="#7a1622" transform="translate(600 280) rotate(20) scale(1.2)"/>
    <circle cx="700" cy="520" r="6"   fill="#a31f2b" opacity="0.85"/>
    <circle cx="740" cy="560" r="4"   fill="#c0392b" opacity="0.8"/>
    <circle cx="660" cy="640" r="5"   fill="#a31f2b" opacity="0.8"/>
    <circle cx="360" cy="660" r="6"   fill="#7a1622" opacity="0.8"/>
    <circle cx="240" cy="620" r="4"   fill="#c0392b" opacity="0.75"/>
    <circle cx="180" cy="500" r="5"   fill="#a31f2b" opacity="0.8"/>
    <circle cx="130" cy="330" r="4"   fill="#c0392b" opacity="0.75"/>
    <circle cx="250" cy="180" r="5"   fill="#a31f2b" opacity="0.8"/>
    <circle cx="340" cy="90"  r="4"   fill="#c0392b" opacity="0.7"/>
    <circle cx="560" cy="70"  r="5"   fill="#a31f2b" opacity="0.75"/>
    <circle cx="700" cy="110" r="4"   fill="#c0392b" opacity="0.7"/>
    <circle cx="820" cy="230" r="5"   fill="#a31f2b" opacity="0.75"/>
    <circle cx="880" cy="350" r="4"   fill="#c0392b" opacity="0.7"/>
    <circle cx="900" cy="480" r="3"   fill="#c0392b" opacity="0.6"/>
    <circle cx="80"  cy="600" r="3"   fill="#c0392b" opacity="0.6"/>
    <circle cx="930" cy="640" r="3"   fill="#7a1622" opacity="0.6"/>
    <circle cx="60"  cy="200" r="3"   fill="#7a1622" opacity="0.55"/>
  </g>

  <!-- gold shrapnel: stamens torn loose -->
  <g fill="none" stroke="#a31f2b" stroke-linecap="round" filter="url(#fleshFine)">
    <path d="M 500 396 Q 600 300 700 250"  stroke-width="3"/>
    <path d="M 500 396 Q 640 420 760 470"  stroke-width="3"/>
    <path d="M 500 396 Q 520 500 560 600"  stroke-width="2.6"/>
    <path d="M 500 396 Q 380 460 260 500"  stroke-width="2.6"/>
    <path d="M 500 396 Q 420 280 380 160"  stroke-width="2.4"/>
    <path d="M 500 396 Q 300 320 180 260"  stroke-width="2.2"/>
  </g>
  <g fill="#d9a441" filter="url(#fleshFine)">
    <circle cx="702" cy="248" r="7"   opacity="0.95"/>
    <circle cx="762" cy="472" r="7.5" opacity="0.95"/>
    <circle cx="562" cy="602" r="6.5" opacity="0.9"/>
    <circle cx="258" cy="502" r="6.5" opacity="0.9"/>
    <circle cx="378" cy="158" r="6"   opacity="0.9"/>
    <circle cx="178" cy="258" r="6"   opacity="0.9"/>
  </g>

  <!-- the ruptured heart -->
  <circle cx="486" cy="396" r="118" fill="#fff3e0" opacity="0.35" filter="url(#soft16)"/>
  <circle cx="486" cy="396" r="70"  fill="#f2937e" opacity="0.7"  filter="url(#soft6)"/>
  <circle cx="486" cy="396" r="46"  fill="#fff3e0" opacity="0.9"  filter="url(#soft6)"/>
  <circle cx="486" cy="396" r="24"  fill="#ffffff"/>
  <g stroke="#d9a441" stroke-linecap="round" stroke-width="3" opacity="0.9">
    <line x1="486" y1="336" x2="486" y2="300" transform="rotate(0   486 396)"/>
    <line x1="486" y1="340" x2="486" y2="308" transform="rotate(45  486 396)"/>
    <line x1="486" y1="336" x2="486" y2="304" transform="rotate(90  486 396)"/>
    <line x1="486" y1="342" x2="486" y2="306" transform="rotate(135 486 396)"/>
    <line x1="486" y1="338" x2="486" y2="300" transform="rotate(180 486 396)"/>
    <line x1="486" y1="340" x2="486" y2="308" transform="rotate(225 486 396)"/>
    <line x1="486" y1="336" x2="486" y2="304" transform="rotate(270 486 396)"/>
    <line x1="486" y1="342" x2="486" y2="306" transform="rotate(315 486 396)"/>
  </g>
  <circle cx="486" cy="396" r="62" fill="none" stroke="#d9a441" stroke-width="2" stroke-dasharray="2 8" opacity="0.8"/>

  <!-- dark debris flung to the corners -->
  <g fill="#43101e" filter="url(#fleshFine)">
    <circle cx="950" cy="90"  r="3" opacity="0.6"/>
    <circle cx="970" cy="130" r="2" opacity="0.5"/>
    <circle cx="60"  cy="720" r="3" opacity="0.6"/>
    <circle cx="100" cy="750" r="2" opacity="0.5"/>
    <circle cx="920" cy="720" r="2.5" opacity="0.55"/>
    <circle cx="80"  cy="80"  r="2.5" opacity="0.55"/>
  </g>

  <!-- vignette + canvas tooth -->
  <rect x="0" y="0" width="1000" height="800" fill="url(#vig)"/>
  <rect x="0" y="0" width="1000" height="800" filter="url(#grain)" opacity="0.2" style="mix-blend-mode:multiply"/>

  <!-- signature -->
  <text x="950" y="774" text-anchor="end" font-family="Georgia, 'Times New Roman', serif"
        font-size="15" fill="#fff3e0" opacity="0.65">Carmine Bloom No. 3 — Detonation — 2026</text>
</svg>
